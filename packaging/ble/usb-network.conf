# USB Ethernet for the dedicated relay appliance. Mode is changed in the app
# and retained in /var/lib/plank-avp-relay/usb/mode.json across upgrades.
[usb-network]
# auto enables the supported Armbian NanoPi Zero2 appliance only.
# Other boards require explicit enablement and USB peripheral kernel support.
enabled = auto
wired_interface =
controller =
otg_node =
function = ncm
# Router mode uses 10.20.30.0/24, with the relay at 10.20.30.1.
