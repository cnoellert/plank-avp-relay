# PLANK Bluetooth tablet relay. Restart the service after editing.
[relay]
adapter = hci0
name = PLANK Tablet Relay
# Empty selects one qualifying Wacom by its input capabilities. With multiple
# tablets, select a Bluetooth address or a usb:/sys/devices/... identity.
tablet =
# Opt in only when PLANK owns the adapter: powers it on, disables new OS-level
# pairing, and clears orphan advertisements when BlueZ has no active instance.
# Existing tablet bonds are retained. Stop this service to pair a new tablet.
exclusive_adapter = false
# Opt-in workaround qualified on Intel 7265 with the tested AVP/BlueZ stack.
# Requires no scanning or other advertisements. Does not erase saved bonds.
disable_controller_address_resolution = false
