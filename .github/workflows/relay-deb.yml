name: Linux relay packages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/relay-deb.yml'
      - 'CMakeLists.txt'
      - 'VERSION'
      - 'src/**'
      - 'include/**'
      - 'tools/**'
      - 'vendor/**'
      - 'tests/**'
      - 'packaging/**'
      - 'debian/**'
      - 'scripts/build-relay-deb.sh'
      - 'scripts/prepare-drawing-source.py'
  pull_request:
    paths:
      - '.github/workflows/relay-deb.yml'
      - 'CMakeLists.txt'
      - 'VERSION'
      - 'src/**'
      - 'include/**'
      - 'tools/**'
      - 'vendor/**'
      - 'tests/**'
      - 'packaging/**'
      - 'debian/**'
      - 'scripts/build-relay-deb.sh'
      - 'scripts/prepare-drawing-source.py'

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.platform }} / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: ubuntu-26.04
            image: ubuntu:26.04
            machine: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            platform: debian-13
            image: debian:13
            machine: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      PLANK_BUILD_JOBS: '4'
    steps:
      - name: Install build and validation tools
        run: |
          # Package installation in this disposable builder must not start daemons.
          printf '#!/bin/sh\nexit 101\n' > /usr/sbin/policy-rc.d
          chmod 755 /usr/sbin/policy-rc.d
          # Minimal Ubuntu images strip docs on installation. Keep package
          # licenses/provenance for the installed-file smoke check.
          for config in /etc/dpkg/dpkg.cfg.d/*; do
            test -f "$config" || continue
            sed -i '\|^path-exclude=/usr/share/doc/|d' "$config"
          done
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config libudev-dev libavahi-client-dev \
            python3 python3-dbus python3-gi debhelper dh-python \
            curl ca-certificates git lintian bluez systemd wpasupplicant dbus iproute2
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Verify native architecture
        run: |
          test "$(dpkg --print-architecture)" = '${{ matrix.arch }}'
          test "$(uname -m)" = '${{ matrix.machine }}'
      - name: Build and test package
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p artifacts/logs
          set -o pipefail
          scripts/build-relay-deb.sh 2>&1 | tee artifacts/logs/build.log
      - name: Validate installed package
        run: |
          set -o pipefail
          package_version=$(dpkg-parsechangelog -SVersion)
          test "$package_version" = "$(cat VERSION)"
          package=(artifacts/deb/"$package_version"/${{ matrix.platform }}/${{ matrix.arch }}/plank-avp-relay_*.deb)
          test "${#package[@]}" = 1
          test "$(dpkg-deb -f "${package[0]}" Version)" = "$package_version"
          test "$(dpkg-deb -f "${package[0]}" Architecture)" = '${{ matrix.arch }}'
          dependencies=$(dpkg-deb -f "${package[0]}" Depends)
          # ctypes does not require the builder's CPython minor version.
          [[ ! $dependencies =~ python3\.[0-9] ]]
          lintian --fail-on error,warning "${package[0]}" 2>&1 | tee artifacts/logs/lintian.log
          apt-get install -y "./${package[0]}"
          plank-avp-relay --check-config
          python3 tests/installed_relay_smoke.py /
          dpkg --verify plank-avp-relay
          readelf -h /usr/lib/plank-avp-relay/libplank_avp_relay.so | tee artifacts/logs/elf-header.log
          systemd-analyze verify /lib/systemd/system/plank-avp-relay.service /lib/systemd/system/plank-avp-relay-hardware.service
          systemd-analyze verify /lib/systemd/system/plank-tablet-relay.service
          systemd-analyze verify /lib/systemd/system/plank-avp-relay-usb.service
          /usr/lib/plank-avp-relay/plank-avp-relay-usb --check-config
          systemd-analyze verify /lib/systemd/system/plank-avp-relay-wifi.service
          /usr/lib/plank-avp-relay/plank-avp-relay-wifi --check-config
          dpkg-query -W -f='${Status}\n' wpasupplicant rfkill | grep -c 'install ok installed' | grep -qx 2
          test -x /usr/libexec/bluetooth/bluetoothd
          test -x /usr/sbin/avahi-daemon
          dpkg-query -W -f='${Status}\n' avahi-daemon | grep -q 'install ok installed'
          systemd-analyze verify /lib/systemd/system/avahi-daemon.service
          systemd-analyze verify /lib/systemd/system/bluetooth.service
          cd "$(dirname "${package[0]}")"
          sha256sum -c SHA256SUMS
      - name: Save packages and build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: relay-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

  install:
    name: Clean ${{ matrix.platform }} install / ${{ matrix.arch }}
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: ubuntu-26.04
            image: ubuntu:26.04
            runner: ubuntu-24.04
          - arch: arm64
            platform: debian-13
            image: debian:13
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Prepare disposable install environment
        run: |
          printf '#!/bin/sh\nexit 101\n' > /usr/sbin/policy-rc.d
          chmod 755 /usr/sbin/policy-rc.d
          # Minimal Ubuntu images strip docs on installation. Keep package
          # licenses/provenance for the installed-file smoke check.
          for config in /etc/dpkg/dpkg.cfg.d/*; do
            test -f "$config" || continue
            sed -i '\|^path-exclude=/usr/share/doc/|d' "$config"
          done
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git python3
          test "$(dpkg --print-architecture)" = '${{ matrix.arch }}'
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: relay-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.sha }}
          path: artifacts
      - name: Install, exercise and remove package
        run: |
          package=(artifacts/deb/*/${{ matrix.platform }}/${{ matrix.arch }}/plank-avp-relay_*.deb)
          test "${#package[@]}" = 1
          package_version=$(dpkg-deb -f "${package[0]}" Version)
          test "$(dirname "${package[0]}")" = "artifacts/deb/$package_version/${{ matrix.platform }}/${{ matrix.arch }}"
          (cd "$(dirname "${package[0]}")" && sha256sum -c SHA256SUMS)
          apt-get install -y "./${package[0]}"
          plank-avp-relay --check-config
          python3 tests/installed_relay_smoke.py /
          dpkg --verify plank-avp-relay
          systemd-analyze verify /lib/systemd/system/plank-avp-relay.service /lib/systemd/system/plank-avp-relay-hardware.service
          systemd-analyze verify /lib/systemd/system/plank-tablet-relay.service
          systemd-analyze verify /lib/systemd/system/plank-avp-relay-usb.service
          /usr/lib/plank-avp-relay/plank-avp-relay-usb --check-config
          systemd-analyze verify /lib/systemd/system/plank-avp-relay-wifi.service
          /usr/lib/plank-avp-relay/plank-avp-relay-wifi --check-config
          dpkg-query -W -f='${Status}\n' wpasupplicant rfkill | grep -c 'install ok installed' | grep -qx 2
          test -L /lib/firmware/updates/rtl_bt/rtl8851bu_fw.bin
          test -x /usr/sbin/avahi-daemon
          dpkg-query -W -f='${Status}\n' avahi-daemon | grep -q 'install ok installed'
          /usr/lib/plank-avp-relay/plank-avp-relay-hardware --firmware-only
          # Exercise the actual postinst's Armbian-only branch without a board.
          test ! -e /etc/armbian-release
          printf 'GOVERNOR="performance"\nENABLED="false"\nMAX_SPEED=2016000\n' > /etc/default/cpufrequtils
          cp /etc/default/cpufrequtils /tmp/cpufrequtils-before
          # Upgrade an earlier customized conffile: remove only its retired
          # Router subnet option before starting the strict USB helper.
          printf '\nrouter_address = 10.55.0.1/24\n' >> /etc/plank-avp-relay/usb-network.conf
          apt-get install --reinstall -y "./${package[0]}"
          ! grep -q '^router_address' /etc/plank-avp-relay/usb-network.conf
          grep -qx 'router_address = 10.55.0.1/24' /var/backups/plank-avp-relay/usb-network.before-fixed-subnet
          /usr/lib/plank-avp-relay/plank-avp-relay-usb --check-config
          cmp /etc/default/cpufrequtils /tmp/cpufrequtils-before
          touch /etc/armbian-release
          # Reinstall and removal must retain private Wi-Fi enrollment. No
          # hardware is claimed in this container, so removal stays inert.
          install -d -m 0700 /var/lib/plank-avp-relay/wifi
          printf 'private fixture\n' > /var/lib/plank-avp-relay/wifi/wpa.conf
          chmod 600 /var/lib/plank-avp-relay/wifi/wpa.conf
          cp /var/lib/plank-avp-relay/wifi/wpa.conf /tmp/wifi-before
          install -d -m 0700 -o plank-relay -g plank-relay /var/lib/plank-tablet-relay
          printf 'private retention fixture\n' > /var/lib/plank-tablet-relay/package-retention-fixture
          chown plank-relay:plank-relay /var/lib/plank-tablet-relay/package-retention-fixture
          chmod 600 /var/lib/plank-tablet-relay/package-retention-fixture
          cp /var/lib/plank-tablet-relay/package-retention-fixture /tmp/raw-state-before
          apt-get install --reinstall -y "./${package[0]}"
          cmp /var/lib/plank-avp-relay/wifi/wpa.conf /tmp/wifi-before
          cmp /var/lib/plank-tablet-relay/package-retention-fixture /tmp/raw-state-before
          grep -qx 'GOVERNOR="schedutil"' /etc/default/cpufrequtils
          grep -qx 'ENABLED="true"' /etc/default/cpufrequtils
          grep -qx 'MAX_SPEED=2016000' /etc/default/cpufrequtils
          cmp /var/backups/plank-avp-relay/cpufrequtils.before-schedutil /tmp/cpufrequtils-before
          apt-get remove -y plank-avp-relay
          cmp /var/lib/plank-avp-relay/wifi/wpa.conf /tmp/wifi-before
          cmp /var/lib/plank-tablet-relay/package-retention-fixture /tmp/raw-state-before
          test ! -e /etc/systemd/network/03-plank-wifi.network
          test ! -e /usr/lib/plank-avp-relay/plank-avp-relay-wifi
          test ! -L /lib/firmware/updates/rtl_bt/rtl8851bu_fw.bin
          test ! -L /lib/firmware/updates/rtl_bt/rtl8851bu_config.bin
          test ! -e /usr/lib/plank-avp-relay/avp_relay
          test ! -e /usr/lib/plank-avp-relay/libplank_avp_relay.so
          test ! -e /usr/libexec/plank-tablet-relay
          test ! -e /usr/lib/systemd/system/plank-tablet-relay.service
          test ! -e /usr/lib/udev/rules.d/70-plank-tablet-relay.rules
          test ! -e /usr/lib/systemd/system/bluetooth.service.d/10-plank-avp-relay.conf
          test -x /usr/sbin/avahi-daemon
          grep -qx 'GOVERNOR="schedutil"' /etc/default/cpufrequtils
          cmp /var/backups/plank-avp-relay/cpufrequtils.before-schedutil /tmp/cpufrequtils-before
          # The next fixture requires an empty new namespace. Retention was
          # checked above; move only our known Wi-Fi fixture out of its way.
          mv /var/lib/plank-avp-relay/wifi/wpa.conf /tmp/wifi-retained-after-removal
          rmdir /var/lib/plank-avp-relay/wifi /var/lib/plank-avp-relay
          python3 tests/package_upgrade_fixture.py prepare "${package[0]}"
          apt-get install -y "./${package[0]}"
          python3 tests/package_upgrade_fixture.py verify
          plank-avp-relay --check-config
