name: Linux relay packages

on:
  workflow_dispatch:
  push:
    branches: [main, visionos-tablet-setup]
    paths:
      - '.github/workflows/relay-deb.yml'
      - 'CMakeLists.txt'
      - 'VERSION'
      - 'src/**'
      - 'include/**'
      - 'tools/**'
      - 'vendor/**'
      - 'tests/**'
      - 'packaging/ble/**'
      - 'debian/**'
      - 'scripts/build-relay-deb.sh'
  pull_request:
    paths:
      - '.github/workflows/relay-deb.yml'
      - 'CMakeLists.txt'
      - 'VERSION'
      - 'src/**'
      - 'include/**'
      - 'tools/**'
      - 'vendor/**'
      - 'tests/**'
      - 'packaging/ble/**'
      - 'debian/**'
      - 'scripts/build-relay-deb.sh'

permissions:
  contents: read

jobs:
  package:
    name: Ubuntu 26.04 / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            machine: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            machine: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: ubuntu:26.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      PLANK_BUILD_JOBS: '4'
    steps:
      - name: Install build and validation tools
        run: |
          # Package installation in this disposable builder must not start daemons.
          printf '#!/bin/sh\nexit 101\n' > /usr/sbin/policy-rc.d
          chmod 755 /usr/sbin/policy-rc.d
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config libudev-dev \
            python3 python3-dbus python3-gi debhelper dh-python \
            curl ca-certificates git lintian bluez systemd
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Verify native architecture
        run: |
          test "$(dpkg --print-architecture)" = '${{ matrix.arch }}'
          test "$(uname -m)" = '${{ matrix.machine }}'
      - name: Build and test package
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p artifacts/logs
          set -o pipefail
          scripts/build-relay-deb.sh 2>&1 | tee artifacts/logs/build.log
      - name: Validate installed package
        run: |
          set -o pipefail
          package_version=$(dpkg-parsechangelog -SVersion)
          package=(artifacts/deb/"$package_version"/ubuntu-26.04/${{ matrix.arch }}/plank-tablet-relay-ble_*.deb)
          test "${#package[@]}" = 1
          test "$(dpkg-deb -f "${package[0]}" Version)" = "$package_version"
          test "$(dpkg-deb -f "${package[0]}" Architecture)" = '${{ matrix.arch }}'
          dependencies=$(dpkg-deb -f "${package[0]}" Depends)
          # ctypes does not require the builder's CPython minor version.
          [[ ! $dependencies =~ python3\.[0-9] ]]
          lintian --fail-on error,warning "${package[0]}" 2>&1 | tee artifacts/logs/lintian.log
          apt-get install -y "./${package[0]}"
          plank-tablet-relay-ble --check-config
          python3 tests/installed_relay_smoke.py /
          dpkg --verify plank-tablet-relay-ble
          readelf -h /usr/lib/plank-tablet-relay-ble/libplank_ble_lab.so | tee artifacts/logs/elf-header.log
          systemd-analyze verify /lib/systemd/system/plank-tablet-relay-ble.service /lib/systemd/system/plank-tablet-relay-hardware.service
          test -x /usr/libexec/bluetooth/bluetoothd
          test -x /usr/sbin/avahi-daemon
          dpkg-query -W -f='${Status}\n' avahi-daemon | grep -q 'install ok installed'
          systemd-analyze verify /lib/systemd/system/avahi-daemon.service
          systemd-analyze verify /lib/systemd/system/bluetooth.service
          cd "$(dirname "${package[0]}")"
          sha256sum -c SHA256SUMS
      - name: Save packages and build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: relay-ubuntu26.04-${{ matrix.arch }}-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

  install:
    name: Clean Ubuntu 26.04 install / ${{ matrix.arch }}
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: ubuntu:26.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Prepare disposable install environment
        run: |
          printf '#!/bin/sh\nexit 101\n' > /usr/sbin/policy-rc.d
          chmod 755 /usr/sbin/policy-rc.d
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git python3
          test "$(dpkg --print-architecture)" = '${{ matrix.arch }}'
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: relay-ubuntu26.04-${{ matrix.arch }}-${{ github.sha }}
          path: artifacts
      - name: Install, exercise and remove package
        run: |
          package=(artifacts/deb/*/ubuntu-26.04/${{ matrix.arch }}/plank-tablet-relay-ble_*.deb)
          test "${#package[@]}" = 1
          package_version=$(dpkg-deb -f "${package[0]}" Version)
          test "$(dirname "${package[0]}")" = "artifacts/deb/$package_version/ubuntu-26.04/${{ matrix.arch }}"
          (cd "$(dirname "${package[0]}")" && sha256sum -c SHA256SUMS)
          apt-get install -y "./${package[0]}"
          plank-tablet-relay-ble --check-config
          python3 tests/installed_relay_smoke.py /
          dpkg --verify plank-tablet-relay-ble
          systemd-analyze verify /lib/systemd/system/plank-tablet-relay-ble.service /lib/systemd/system/plank-tablet-relay-hardware.service
          test -L /lib/firmware/updates/rtl_bt/rtl8851bu_fw.bin
          test -x /usr/sbin/avahi-daemon
          dpkg-query -W -f='${Status}\n' avahi-daemon | grep -q 'install ok installed'
          /usr/lib/plank-tablet-relay-ble/plank-tablet-relay-hardware --firmware-only
          # Exercise the actual postinst's Armbian-only branch without a board.
          test ! -e /etc/armbian-release
          printf 'GOVERNOR="performance"\nENABLED="false"\nMAX_SPEED=2016000\n' > /etc/default/cpufrequtils
          cp /etc/default/cpufrequtils /tmp/cpufrequtils-before
          apt-get install --reinstall -y "./${package[0]}"
          cmp /etc/default/cpufrequtils /tmp/cpufrequtils-before
          touch /etc/armbian-release
          apt-get install --reinstall -y "./${package[0]}"
          grep -qx 'GOVERNOR="powersave"' /etc/default/cpufrequtils
          grep -qx 'ENABLED="true"' /etc/default/cpufrequtils
          grep -qx 'MAX_SPEED=2016000' /etc/default/cpufrequtils
          cmp /var/backups/plank-tablet-relay/cpufrequtils.before-powersave /tmp/cpufrequtils-before
          apt-get remove -y plank-tablet-relay-ble
          test ! -L /lib/firmware/updates/rtl_bt/rtl8851bu_fw.bin
          test ! -L /lib/firmware/updates/rtl_bt/rtl8851bu_config.bin
          test ! -e /usr/lib/plank-tablet-relay-ble/ble_lab
          test ! -e /usr/lib/plank-tablet-relay-ble/libplank_ble_lab.so
          test ! -e /usr/lib/systemd/system/bluetooth.service.d/10-plank-tablet-relay-ble.conf
          test -x /usr/sbin/avahi-daemon
          grep -qx 'GOVERNOR="powersave"' /etc/default/cpufrequtils
          cmp /var/backups/plank-tablet-relay/cpufrequtils.before-powersave /tmp/cpufrequtils-before
